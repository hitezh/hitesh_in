<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="An editorial diagram. A stream of code blocks generated by an AI flows toward a vertical filter labelled the stack. Two blocks marked with an X are caught and held at the filter, while clean blocks pass through to a column labelled shipped. The message: choose a stack that catches the machine's mistakes before a human has to.">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
      .sans  { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="1200" height="630" fill="#FAF7F2"/>
  <rect x="14" y="14" width="1172" height="602" rx="10" fill="none" stroke="#E8DDD0" stroke-width="2"/>

  <!-- kicker -->
  <text x="92" y="132" class="sans" font-size="19" letter-spacing="4" fill="#7B746E">ON&#160;&#160;AI&#160;&#160;STRATEGY</text>

  <!-- headline -->
  <text x="88" y="238" class="serif" font-size="72" fill="#1A1816">Pick the stack that</text>
  <text x="88" y="318" class="serif" font-size="72" fill="#1A1816">catches the mistakes<tspan fill="#BF4B1A">.</tspan></text>

  <rect x="92" y="352" width="68" height="5" rx="2.5" fill="#BF4B1A"/>

  <text x="92" y="408" class="sans" font-size="22" fill="#7B746E">When a machine writes the code, choose the</text>
  <text x="92" y="438" class="sans" font-size="22" fill="#7B746E">language where its errors are cheap to catch.</text>

  <!-- diagram: generated blocks flow into a filter; bad ones caught, clean ones ship -->

  <!-- source label -->
  <text x="640" y="486" class="sans" font-size="15" fill="#B5AFA9">AI generates</text>

  <!-- incoming stream of code blocks (two flagged) -->
  <rect x="640" y="500" width="24" height="24" rx="4" fill="#BF4B1A" fill-opacity="0.10" stroke="#BF4B1A" stroke-width="2"/>
  <line x1="646" y1="506" x2="658" y2="518" stroke="#BF4B1A" stroke-width="2"/>
  <line x1="658" y1="506" x2="646" y2="518" stroke="#BF4B1A" stroke-width="2"/>

  <rect x="676" y="500" width="24" height="24" rx="4" fill="none" stroke="#B5AFA9" stroke-width="2"/>
  <rect x="712" y="500" width="24" height="24" rx="4" fill="#BF4B1A" fill-opacity="0.10" stroke="#BF4B1A" stroke-width="2"/>
  <line x1="718" y1="506" x2="730" y2="518" stroke="#BF4B1A" stroke-width="2"/>
  <line x1="730" y1="506" x2="718" y2="518" stroke="#BF4B1A" stroke-width="2"/>
  <rect x="748" y="500" width="24" height="24" rx="4" fill="none" stroke="#B5AFA9" stroke-width="2"/>

  <!-- flow arrow into the filter -->
  <line x1="782" y1="512" x2="922" y2="512" stroke="#B5AFA9" stroke-width="2"/>
  <path d="M914,505 L930,512 L914,519 Z" fill="#7B746E"/>

  <!-- the filter / stack: a slotted gate -->
  <rect x="936" y="452" width="14" height="120" rx="4" fill="#BF4B1A"/>
  <rect x="939" y="470" width="8" height="10" rx="2" fill="#FAF7F2"/>
  <rect x="939" y="492" width="8" height="10" rx="2" fill="#FAF7F2"/>
  <rect x="939" y="514" width="8" height="10" rx="2" fill="#FAF7F2"/>
  <rect x="939" y="536" width="8" height="10" rx="2" fill="#FAF7F2"/>
  <text x="943" y="434" class="sans" font-size="18" fill="#1A1816" text-anchor="middle">the stack</text>
  <text x="943" y="596" class="sans" font-size="15" fill="#7B746E" text-anchor="middle">types, tests, compiler</text>

  <!-- caught: a flagged block held at the gate -->
  <rect x="902" y="466" width="24" height="24" rx="4" fill="#BF4B1A" fill-opacity="0.14" stroke="#BF4B1A" stroke-width="2"/>
  <line x1="908" y1="472" x2="920" y2="484" stroke="#BF4B1A" stroke-width="2"/>
  <line x1="920" y1="472" x2="908" y2="484" stroke="#BF4B1A" stroke-width="2"/>

  <!-- clean blocks pass through to shipped -->
  <line x1="954" y1="512" x2="1044" y2="512" stroke="#E8DDD0" stroke-width="2"/>
  <path d="M1036,505 L1052,512 L1036,519 Z" fill="#7B746E"/>
  <rect x="1060" y="500" width="24" height="24" rx="4" fill="none" stroke="#7B746E" stroke-width="2"/>
  <path d="M1066,512 L1071,517 L1079,507" fill="none" stroke="#7B746E" stroke-width="2"/>
  <text x="1108" y="516" class="sans" font-size="15" fill="#B5AFA9">shipped</text>
</svg>
