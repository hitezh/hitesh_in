  </style></defs>

  <rect width="1200" height="1500" fill="#FAF7F2"/>
  <rect x="14" y="14" width="1172" height="1472" rx="10" fill="none" stroke="#E8DDD0" stroke-width="2"/>

  <text x="90" y="136" class="sans" font-size="19" letter-spacing="4" fill="#7B746E">WHAT CHANGED</text>
  <text x="1110" y="136" class="sans" font-size="19" letter-spacing="2" fill="#B5AFA9" text-anchor="end">4 / 6</text>

