<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Carousel slide: headline the AI removed the smell test, explaining that old spam had to survive a human at the point of decision while an answer engine deletes that moment.">
