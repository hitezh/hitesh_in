<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A mixing desk with two vertical faders. The fader labelled OUTPUT is pushed to the top, the fader labelled RELIABILITY sits near the bottom, and a single gain knob marked AI feeds both. The image shows that AI turns up whatever channel the scoreboard already favours, boosting visible output while reliability stays low.">
  <defs>
    <style>
      .serif{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;}
      .sans{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#BF4B1A"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#FAF7F2"/>
  <rect x="14" y="14" width="1172" height="602" rx="10" fill="none" stroke="#E8DDD0" stroke-width="2"/>

  <!-- right-side visual: a mixing desk where AI is the gain knob -->
  <g class="sans">
    <text x="940" y="120" font-size="13" letter-spacing="3" fill="#A99E92" text-anchor="middle">ONE GAIN KNOB. TWO CHANNELS.</text>

    <!-- the AI gain knob feeding both faders -->
    <circle cx="940" cy="176" r="30" fill="#1A1816"/>
    <line x1="940" y1="176" x2="958" y2="158" stroke="#BF4B1A" stroke-width="4" stroke-linecap="round"/>
    <text x="940" y="238" font-size="15" font-weight="800" letter-spacing="2" fill="#7B746E" text-anchor="middle">AI</text>
    <line x1="912" y1="196" x2="828" y2="270" stroke="#BF4B1A" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="968" y1="196" x2="1052" y2="270" stroke="#BF4B1A" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- OUTPUT fader: pushed to the top -->
    <rect x="820" y="286" width="16" height="220" rx="8" fill="#E8DDD0"/>
    <rect x="820" y="286" width="16" height="70" rx="8" fill="#BF4B1A"/>
    <rect x="800" y="300" width="56" height="26" rx="6" fill="#1A1816"/>
    <text x="828" y="536" font-size="15" font-weight="700" letter-spacing="1" fill="#1A1816" text-anchor="middle">OUTPUT</text>
    <text x="828" y="558" font-size="12" fill="#A99E92" text-anchor="middle">visible</text>

    <!-- RELIABILITY fader: left near the bottom -->
    <rect x="1044" y="286" width="16" height="220" rx="8" fill="#E8DDD0"/>
    <rect x="1044" y="466" width="16" height="40" rx="8" fill="#B7AFA4"/>
    <rect x="1024" y="452" width="56" height="26" rx="6" fill="#7B746E"/>
    <text x="1052" y="536" font-size="15" font-weight="700" letter-spacing="1" fill="#7B746E" text-anchor="middle">RELIABILITY</text>
    <text x="1052" y="558" font-size="12" fill="#A99E92" text-anchor="middle">invisible</text>
  </g>

  <text x="84" y="150" class="sans" font-size="19" letter-spacing="4" fill="#7B746E">AI  AND  INCENTIVES</text>

  <text x="84" y="256" class="serif" font-size="52" font-weight="800" fill="#1A1816">AI didn't make</text>
  <text x="84" y="320" class="serif" font-size="52" font-weight="800" fill="#1A1816">your software worse.</text>
  <text x="84" y="384" class="serif" font-size="52" font-weight="800" fill="#BF4B1A">Your scoreboard did.</text>

  <rect x="84" y="416" width="72" height="5" rx="2.5" fill="#BF4B1A"/>
  <text x="84" y="466" class="sans" font-size="21" fill="#7B746E">AI turns up whatever your scoreboard</text>
  <text x="84" y="496" class="sans" font-size="21" fill="#7B746E">already points at. Most point the wrong way.</text>
</svg>
