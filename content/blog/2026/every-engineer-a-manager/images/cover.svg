<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="An editorial diagram: a ladder rising to an accent dot labelled senior judgment. The top rungs are solid, but the lower rungs are faded and dashed, labelled the junior rungs AI removed. The point: you can only delegate what you can verify, and the path that made verifiers is disappearing.">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
      .sans  { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="1200" height="630" fill="#FAF7F2"/>
  <rect x="14" y="14" width="1172" height="602" rx="10" fill="none" stroke="#E8DDD0" stroke-width="2"/>

  <!-- left: text block -->
  <text x="92" y="150" class="sans" font-size="19" letter-spacing="4" fill="#7B746E">ON&#160;&#160;AI&#160;&#160;&amp;&#160;&#160;ENGINEERING</text>

  <text x="88" y="262" class="serif" font-size="76" fill="#1A1816">AI made you</text>
  <text x="88" y="342" class="serif" font-size="76" fill="#1A1816">a manager<tspan fill="#BF4B1A">.</tspan></text>

  <rect x="92" y="376" width="68" height="5" rx="2.5" fill="#BF4B1A"/>

  <text x="92" y="432" class="sans" font-size="22" fill="#7B746E">You can only delegate</text>
  <text x="92" y="464" class="sans" font-size="22" fill="#7B746E">what you can verify.</text>

  <!-- right: ladder with removed lower rungs -->
  <!-- rails -->
  <line x1="866" y1="176" x2="866" y2="326" stroke="#1A1816" stroke-width="5" stroke-linecap="round"/>
  <line x1="946" y1="176" x2="946" y2="326" stroke="#1A1816" stroke-width="5" stroke-linecap="round"/>
  <!-- faded lower rails (the part that's gone) -->
  <line x1="866" y1="330" x2="866" y2="482" stroke="#E8DDD0" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
  <line x1="946" y1="330" x2="946" y2="482" stroke="#E8DDD0" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>

  <!-- solid top rungs (senior work that remains) -->
  <g stroke="#1A1816" stroke-width="5" stroke-linecap="round">
    <line x1="866" y1="212" x2="946" y2="212"/>
    <line x1="866" y1="250" x2="946" y2="250"/>
    <line x1="866" y1="288" x2="946" y2="288"/>
  </g>

  <!-- faded / removed lower rungs (the junior climb) -->
  <g stroke="#C9B8A6" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12">
    <line x1="866" y1="326" x2="946" y2="326"/>
    <line x1="866" y1="364" x2="946" y2="364"/>
    <line x1="866" y1="402" x2="946" y2="402"/>
    <line x1="866" y1="440" x2="946" y2="440"/>
  </g>

  <!-- accent dot: where you end up -->
  <circle cx="906" cy="176" r="13" fill="#BF4B1A"/>

  <!-- labels -->
  <line x1="925" y1="176" x2="1010" y2="176" stroke="#E8DDD0" stroke-width="2"/>
  <text x="1018" y="181" class="sans" font-size="19" fill="#1A1816">senior judgment</text>

  <line x1="960" y1="402" x2="1010" y2="402" stroke="#E8DDD0" stroke-width="2"/>
  <text x="1018" y="397" class="sans" font-size="18" fill="#B5AFA9">the junior rungs</text>
  <text x="1018" y="421" class="sans" font-size="18" fill="#B5AFA9">AI removed</text>
</svg>
