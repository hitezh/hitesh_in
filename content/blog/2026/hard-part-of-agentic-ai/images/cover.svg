<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A list of five agent-protocol roadmap priorities. Three are solid, highlighted bars labeled identity and authorization, server-initiated messaging, and HTTP transport, marked as plumbing. Two are faint, small bars labeled tool results and SDK ergonomics, marked as the AI part. A note reads three of five are plumbing.">
  <defs><style>
    .serif{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;}
    .sans{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;}
  </style></defs>

  <rect width="1200" height="630" fill="#FAF7F2"/>
  <rect x="14" y="14" width="1172" height="602" rx="10" fill="none" stroke="#E8DDD0" stroke-width="2"/>

  <!-- right panel: the five roadmap priorities -->
  <g>
    <text x="812" y="116" class="sans" font-size="15" letter-spacing="3" fill="#A79E95">AGENT PROTOCOL ROADMAP</text>

    <!-- three plumbing priorities: solid, accented -->
    <rect x="812" y="140" width="300" height="58" rx="8" fill="#BF4B1A"/>
    <text x="832" y="166" class="sans" font-size="18" font-weight="800" fill="#FAF7F2">Identity &amp; authorization</text>
    <text x="832" y="186" class="sans" font-size="12" letter-spacing="1" fill="#F3D9CB">WHO IS THE AGENT, ON WHOSE BEHALF</text>

    <rect x="812" y="208" width="300" height="58" rx="8" fill="#BF4B1A"/>
    <text x="832" y="234" class="sans" font-size="18" font-weight="800" fill="#FAF7F2">Server-initiated messaging</text>
    <text x="832" y="254" class="sans" font-size="12" letter-spacing="1" fill="#F3D9CB">STOP THE AGENTS POLLING</text>

    <rect x="812" y="276" width="300" height="58" rx="8" fill="#BF4B1A"/>
    <text x="832" y="302" class="sans" font-size="18" font-weight="800" fill="#FAF7F2">HTTP transport</text>
    <text x="832" y="322" class="sans" font-size="12" letter-spacing="1" fill="#F3D9CB">ONE BORING PIPE</text>

    <text x="1128" y="237" class="sans" font-size="12" letter-spacing="2" fill="#A79E95" text-anchor="middle" transform="rotate(90 1128 237)">PLUMBING</text>

    <!-- two AI priorities: faint, thin -->
    <rect x="812" y="352" width="300" height="38" rx="8" fill="none" stroke="#D8CBBB" stroke-width="1.5"/>
    <text x="832" y="376" class="sans" font-size="16" font-weight="600" fill="#9A9088">Tool results</text>

    <rect x="812" y="400" width="300" height="38" rx="8" fill="none" stroke="#D8CBBB" stroke-width="1.5"/>
    <text x="832" y="424" class="sans" font-size="16" font-weight="600" fill="#9A9088">SDK ergonomics</text>

    <text x="1128" y="399" class="sans" font-size="12" letter-spacing="2" fill="#C1B7AA" text-anchor="middle" transform="rotate(90 1128 399)">THE "AI"</text>

    <rect x="812" y="470" width="300" height="1.5" fill="#E0D3C2"/>
    <text x="812" y="502" class="sans" font-size="17" font-weight="700" fill="#5C554F">3 of 5 priorities are plumbing.</text>
  </g>

  <!-- left column: title -->
  <text x="84" y="150" class="sans" font-size="19" letter-spacing="4" fill="#7B746E">AGENTIC  AI</text>

  <text x="84" y="252" class="serif" font-size="52" font-weight="800" fill="#1A1816">The hard part of</text>
  <text x="84" y="312" class="serif" font-size="52" font-weight="800" fill="#1A1816">agentic AI</text>
  <text x="84" y="372" class="serif" font-size="52" font-weight="800" fill="#BF4B1A">isn't the AI.</text>

  <rect x="84" y="406" width="72" height="5" rx="2.5" fill="#BF4B1A"/>
  <text x="84" y="456" class="sans" font-size="20" fill="#7B746E">The gate to useful enterprise agents is</text>
  <text x="84" y="484" class="sans" font-size="20" fill="#7B746E">identity, authorization, and integration,</text>
  <text x="84" y="512" class="sans" font-size="20" fill="#7B746E">not model capability you can simply rent.</text>
</svg>
