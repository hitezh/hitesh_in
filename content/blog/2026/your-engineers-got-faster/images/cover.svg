<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="An editorial diagram: fast-moving arrows of AI-written code accelerate in from the left and jam against a narrow gate labelled the constraint, while only a thin trickle passes through to delivered. Individual speed went up; company throughput did not.">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
      .sans  { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="1200" height="630" fill="#FAF7F2"/>
  <rect x="14" y="14" width="1172" height="602" rx="10" fill="none" stroke="#E8DDD0" stroke-width="2"/>

  <!-- left: text block -->
  <text x="92" y="150" class="sans" font-size="19" letter-spacing="4" fill="#7B746E">ON&#160;&#160;AI&#160;&#160;STRATEGY</text>

  <text x="88" y="258" class="serif" font-size="70" fill="#1A1816">Your engineers</text>
  <text x="88" y="336" class="serif" font-size="70" fill="#1A1816">got faster<tspan fill="#BF4B1A">.</tspan></text>

  <rect x="92" y="370" width="68" height="5" rx="2.5" fill="#BF4B1A"/>

  <text x="92" y="428" class="sans" font-size="22" fill="#7B746E">Your company throughput</text>
  <text x="92" y="460" class="sans" font-size="22" fill="#7B746E">stayed where the constraint is.</text>

  <!-- right: bottleneck diagram -->
  <!-- fast inflow: accelerating arrows of generated code -->
  <g stroke="#7B746E" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="700" y1="220" x2="912" y2="220"/>
    <line x1="712" y1="258" x2="912" y2="258"/>
    <line x1="700" y1="296" x2="912" y2="296"/>
    <line x1="712" y1="372" x2="912" y2="372"/>
    <line x1="700" y1="410" x2="912" y2="410"/>
  </g>
  <!-- one accented fast lane -->
  <line x1="700" y1="334" x2="912" y2="334" stroke="#BF4B1A" stroke-width="6" stroke-linecap="round"/>
  <!-- arrow heads at the jam -->
  <g fill="#7B746E">
    <path d="M912,210 l16,10 l-16,10 z"/>
    <path d="M912,248 l16,10 l-16,10 z"/>
    <path d="M912,286 l16,10 l-16,10 z"/>
    <path d="M912,362 l16,10 l-16,10 z"/>
    <path d="M912,400 l16,10 l-16,10 z"/>
  </g>
  <path d="M912,324 l16,10 l-16,10 z" fill="#BF4B1A"/>

  <text x="806" y="192" class="sans" font-size="17" fill="#B5AFA9" text-anchor="middle">AI-written code</text>

  <!-- the narrow gate: the constraint -->
  <rect x="946" y="196" width="12" height="238" rx="4" fill="#E8DDD0"/>
  <rect x="946" y="316" width="12" height="40" rx="4" fill="#BF4B1A"/>
  <text x="952" y="470" class="sans" font-size="18" fill="#BF4B1A" text-anchor="middle">the constraint</text>
  <text x="952" y="494" class="sans" font-size="14" fill="#B5AFA9" text-anchor="middle">review . decisions . trust</text>

  <!-- thin trickle past the gate -->
  <line x1="964" y1="336" x2="1104" y2="336" stroke="#BF4B1A" stroke-width="6" stroke-linecap="round"/>
  <path d="M1104,326 l16,10 l-16,10 z" fill="#BF4B1A"/>
  <text x="1092" y="308" class="sans" font-size="17" fill="#B5AFA9" text-anchor="middle">delivered</text>
</svg>
