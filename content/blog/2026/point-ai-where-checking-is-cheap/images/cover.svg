<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="An editorial diagram contrasting two costs. On the left, a wide fast arrow labelled generate with a small price tag of one week and 100k dollars. On the right, a tall narrow gate labelled verify with a large price tag of one month of expert time. The message: generation is cheap, verification is the expensive constraint.">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
      .sans  { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="1200" height="630" fill="#FAF7F2"/>
  <rect x="14" y="14" width="1172" height="602" rx="10" fill="none" stroke="#E8DDD0" stroke-width="2"/>

  <!-- kicker -->
  <text x="92" y="132" class="sans" font-size="19" letter-spacing="4" fill="#7B746E">ON&#160;&#160;AI&#160;&#160;STRATEGY</text>

  <!-- headline -->
  <text x="88" y="238" class="serif" font-size="72" fill="#1A1816">Generation is cheap.</text>
  <text x="88" y="318" class="serif" font-size="72" fill="#1A1816">Checking is the bill<tspan fill="#BF4B1A">.</tspan></text>

  <rect x="92" y="352" width="68" height="5" rx="2.5" fill="#BF4B1A"/>

  <text x="92" y="408" class="sans" font-size="22" fill="#7B746E">Verification cost, not model quality,</text>
  <text x="92" y="438" class="sans" font-size="22" fill="#7B746E">decides where AI actually pays off.</text>

  <!-- diagram: generate (wide, cheap) into a narrow verify gate (expensive) -->

  <!-- generate: broad fast arrow -->
  <path d="M700,506 L940,506 L940,486 L988,521 L940,556 L940,536 L700,536 Z" fill="#BF4B1A" fill-opacity="0.10" stroke="#BF4B1A" stroke-width="2"/>
  <text x="712" y="527" class="sans" font-size="18" fill="#BF4B1A">generate</text>
  <text x="700" y="578" class="sans" font-size="15" fill="#B5AFA9">~1 week&#160;&#160;&#183;&#160;&#160;$100k compute</text>

  <!-- the narrow verify gate -->
  <rect x="1004" y="470" width="12" height="102" rx="3" fill="#BF4B1A"/>
  <text x="1010" y="452" class="sans" font-size="18" fill="#1A1816" text-anchor="middle">verify</text>
  <text x="1010" y="596" class="sans" font-size="15" fill="#7B746E" text-anchor="middle">~1 month, expert time</text>

  <!-- thin trickle past the gate -->
  <line x1="1020" y1="521" x2="1104" y2="521" stroke="#E8DDD0" stroke-width="2"/>
  <path d="M1096,514 L1112,521 L1096,528 Z" fill="#7B746E"/>
  <text x="1108" y="500" class="sans" font-size="15" fill="#B5AFA9" text-anchor="middle">trusted</text>
</svg>
