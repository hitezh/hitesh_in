<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Cover: 'The excuse just became a one-prompt demo.' A dark editorial card noting that when a twenty-dollar model catches what a billion-dollar system missed, 'we couldn't have known' stops working.">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9FF43"/>
      <stop offset="1" stop-color="#50E3C2"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
    <style>
      .display { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#surface)"/>
  <circle cx="1080" cy="-10" r="220" fill="#2166F3" fill-opacity=".52" filter="url(#blur)"/>
  <circle cx="1020" cy="580" r="180" fill="#00C2A8" fill-opacity=".24" filter="url(#blur)"/>
  <path d="M0 535 C240 420 365 670 595 532 S950 426 1200 520" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="574" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/>

  <g class="sans" fill="#D9FF43">
    <circle cx="88" cy="96" r="7"/>
    <text x="108" y="103" font-size="17" font-weight="700" letter-spacing="3">AI STRATEGY / GOVERNANCE</text>
  </g>

  <g class="display" font-size="78" font-weight="700" fill="#FFFFFF">
    <text x="82" y="228">The excuse</text>
    <text x="82" y="316">just became a</text>
    <text x="82" y="404"><tspan fill="#D9FF43">one-prompt</tspan> demo.</text>
  </g>

  <text x="88" y="470" class="sans" font-size="21" fill="#D9E2F2">A $20 model catches what a billion-dollar system missed.</text>
  <text x="88" y="500" class="sans" font-size="21" fill="#D9E2F2">"We couldn't have known" stops working.</text>

  <g transform="translate(1000 250)">
    <circle r="96" fill="#D9FF43" fill-opacity=".12" stroke="#D9FF43" stroke-width="2"/>
    <circle r="64" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2" stroke-dasharray="7 10"/>
    <path d="M-34 4 L-8 30 L40 -30" fill="none" stroke="url(#signal)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="88" y="556" class="sans" font-size="16" font-weight="700" letter-spacing="2.5" fill="#AAB8D0">HITESH.IN</text>
</svg>
