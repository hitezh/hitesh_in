<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A diagram: a small faded box labelled MODEL sits at the centre, surrounded by six prominent boxes for the scaffolding around it: context window, chat template, tools, quantization, evals, and retrieval.">
  <defs><style>
    .serif{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;}
    .sans{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;}
  </style></defs>

  <rect width="1200" height="630" fill="#FAF7F2"/>
  <rect x="14" y="14" width="1172" height="602" rx="10" fill="none" stroke="#E8DDD0" stroke-width="2"/>

  <!-- connectors from the scaffolding to the model -->
  <g stroke="#D9CBB9" stroke-width="2">
    <line x1="930" y1="202" x2="930" y2="289"/>
    <line x1="862" y1="258" x2="890" y2="300"/>
    <line x1="1000" y1="258" x2="972" y2="300"/>
    <line x1="862" y1="406" x2="892" y2="330"/>
    <line x1="1000" y1="406" x2="970" y2="330"/>
    <line x1="930" y1="462" x2="930" y2="343"/>
  </g>

  <!-- the small, faded model at the centre -->
  <rect x="880" y="289" width="100" height="54" rx="8" fill="none" stroke="#C9BEB0" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="930" y="321" class="sans" font-size="18" font-weight="700" fill="#A79E95" text-anchor="middle">MODEL</text>

  <!-- the scaffolding that actually decides the outcome -->
  <g>
    <rect x="820" y="150" width="220" height="52" rx="8" fill="#BF4B1A"/>
    <text x="930" y="182" class="sans" font-size="18" font-weight="700" fill="#FAF7F2" text-anchor="middle">CONTEXT WINDOW</text>

    <rect x="712" y="232" width="150" height="52" rx="8" fill="#EADFD1" stroke="#E0D3C2" stroke-width="1.5"/>
    <text x="787" y="264" class="sans" font-size="16" font-weight="700" fill="#5C554F" text-anchor="middle">CHAT TEMPLATE</text>

    <rect x="1000" y="232" width="140" height="52" rx="8" fill="#EADFD1" stroke="#E0D3C2" stroke-width="1.5"/>
    <text x="1070" y="264" class="sans" font-size="16" font-weight="700" fill="#5C554F" text-anchor="middle">TOOLS</text>

    <rect x="712" y="380" width="150" height="52" rx="8" fill="#EADFD1" stroke="#E0D3C2" stroke-width="1.5"/>
    <text x="787" y="412" class="sans" font-size="15" font-weight="700" fill="#5C554F" text-anchor="middle">QUANTIZATION</text>

    <rect x="1000" y="380" width="140" height="52" rx="8" fill="#EADFD1" stroke="#E0D3C2" stroke-width="1.5"/>
    <text x="1070" y="412" class="sans" font-size="16" font-weight="700" fill="#5C554F" text-anchor="middle">EVALS</text>

    <rect x="820" y="462" width="220" height="52" rx="8" fill="#BF4B1A"/>
    <text x="930" y="494" class="sans" font-size="18" font-weight="700" fill="#FAF7F2" text-anchor="middle">RETRIEVAL</text>
  </g>

  <text x="84" y="150" class="sans" font-size="19" letter-spacing="4" fill="#7B746E">AI  STRATEGY</text>

  <text x="84" y="242" class="serif" font-size="52" font-weight="800" fill="#1A1816">The model is the</text>
  <text x="84" y="304" class="serif" font-size="52" font-weight="800" fill="#BF4B1A">least important</text>
  <text x="84" y="366" class="serif" font-size="52" font-weight="800" fill="#1A1816">part of your AI.</text>

  <rect x="84" y="398" width="72" height="5" rx="2.5" fill="#BF4B1A"/>
  <text x="84" y="448" class="sans" font-size="20" fill="#7B746E">The same weights feel brilliant in the cloud and</text>
  <text x="84" y="476" class="sans" font-size="20" fill="#7B746E">dull on your servers. The gap is the plumbing.</text>
</svg>
