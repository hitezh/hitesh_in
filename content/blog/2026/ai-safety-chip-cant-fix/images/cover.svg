<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A blog cover styled as a screenshot of an X post by Hitesh Sarda: the claim in caps reads NVIDIA BUILT A CHIP YOUR AGENT CAN'T ARGUE WITH, followed by the line, it still can't tell you what to forbid, and the hashtag AIAGENTS.">
  <defs>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2166F3"/>
      <stop offset="1" stop-color="#00C2A8"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Full-bleed black, like an X dark-mode screenshot. No frame, no border. -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Author row -->
  <circle cx="104" cy="96" r="44" fill="url(#avatar)"/>
  <text x="104" y="108" class="sans" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle">HS</text>

  <text x="168" y="86" class="sans" font-size="35" font-weight="700" fill="#E7E9EA">Hitesh Sarda</text>
  <g transform="translate(406 74)">
    <circle r="15" fill="#1D9BF0"/>
    <path d="M-7 0l5 5 9-9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="168" y="132" class="sans" font-size="33" fill="#71767B">@fullstackcto</text>

  <rect x="856" y="64" width="190" height="64" rx="32" fill="#EFF3F4"/>
  <text x="951" y="107" class="sans" font-size="30" font-weight="700" fill="#0F1419" text-anchor="middle">Follow</text>
  <g fill="#71767B">
    <circle cx="1092" cy="96" r="5"/>
    <circle cx="1114" cy="96" r="5"/>
    <circle cx="1136" cy="96" r="5"/>
  </g>

  <!-- The post itself -->
  <g class="sans" font-size="50" fill="#E7E9EA">
    <text x="64" y="242">NVIDIA BUILT A CHIP YOUR AGENT</text>
    <text x="64" y="306">CAN'T ARGUE WITH.</text>

    <text x="64" y="404">it still can't tell you what to forbid.</text>
    <text x="64" y="468">that part's still yours.</text>
  </g>

  <!-- Trailing hashtag -->
  <text x="64" y="528" class="sans" font-size="34" fill="#1D9BF0">#AIAGENTS</text>

  <!-- Timestamp and view count -->
  <text x="64" y="588" class="sans" font-size="30" fill="#71767B">9:14 AM &#183; Sep 29, 2026 &#183; <tspan font-weight="700" fill="#E7E9EA">2.1M</tspan> Views</text>
</svg>
