<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A diagram: two solid steps labeled Induction and Deduction, then a gap the AI's arc cannot cross to reach a faded, dashed block labeled Abduction, the jump.">
  <defs><style>
    .serif{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;}
    .sans{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;}
  </style></defs>

  <rect width="1200" height="630" fill="#FAF7F2"/>
  <rect x="14" y="14" width="1172" height="602" rx="10" fill="none" stroke="#E8DDD0" stroke-width="2"/>

  <!-- right-side diagram: two solid steps, a gap, then an unreachable block -->
  <g>
    <!-- step 1: induction -->
    <rect x="742" y="452" width="168" height="58" rx="8" fill="#EADFD1" stroke="#E0D3C2" stroke-width="1.5"/>
    <text x="826" y="488" class="sans" font-size="19" font-weight="700" fill="#5C554F" text-anchor="middle">INDUCTION</text>

    <!-- step 2: deduction -->
    <rect x="866" y="384" width="168" height="58" rx="8" fill="#EADFD1" stroke="#E0D3C2" stroke-width="1.5"/>
    <text x="950" y="420" class="sans" font-size="19" font-weight="700" fill="#5C554F" text-anchor="middle">DEDUCTION</text>

    <!-- target: abduction, out of reach -->
    <rect x="962" y="176" width="182" height="66" rx="8" fill="none" stroke="#C9BEB0" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="1053" y="209" class="sans" font-size="19" font-weight="700" fill="#A79E95" text-anchor="middle">ABDUCTION</text>
    <text x="1053" y="230" class="sans" font-size="12" letter-spacing="1" fill="#B7AEA4" text-anchor="middle">THE JUMP</text>

    <!-- the attempted leap: solid arc rising from deduction, arrowhead falling short -->
    <g stroke="#BF4B1A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1006 382 C 1030 330 1035 300 1040 278"/>
      <path d="M1027 296 L1040 272 L1052 296"/>
    </g>
    <!-- the gap it can't cross, dashed and unmade -->
    <path d="M1044 262 L1052 246" stroke="#C9BEB0" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="3 7"/>
  </g>

  <text x="84" y="150" class="sans" font-size="19" letter-spacing="4" fill="#7B746E">AI  STRATEGY</text>

  <text x="84" y="258" class="serif" font-size="58" font-weight="800" fill="#1A1816">AI won't have</text>
  <text x="84" y="324" class="serif" font-size="58" font-weight="800" fill="#BF4B1A">your next idea.</text>

  <rect x="84" y="358" width="72" height="5" rx="2.5" fill="#BF4B1A"/>
  <text x="84" y="408" class="sans" font-size="21" fill="#7B746E">It can reason and prove. It can't make the leap</text>
  <text x="84" y="438" class="sans" font-size="21" fill="#7B746E">to an idea that isn't already in the data.</text>
</svg>
