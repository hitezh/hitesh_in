  <text x="64" y="552" class="sans" font-size="34" fill="#1D9BF0">#AIagents</text>

  <text x="64" y="602" class="sans" font-size="30" fill="#71767B">11:04 AM &#183; Sep 21, 2026 &#183; <tspan font-weight="700" fill="#E7E9EA">356K</tspan> Views</text>
</svg>
