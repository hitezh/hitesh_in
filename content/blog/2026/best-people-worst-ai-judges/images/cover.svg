  <text x="64" y="526" class="sans" font-size="34" fill="#1D9BF0">#AIstrategy</text>

  <text x="64" y="586" class="sans" font-size="30" fill="#71767B">9:12 AM &#183; Sep 21, 2026 &#183; <tspan font-weight="700" fill="#E7E9EA">412K</tspan> Views</text>
</svg>
