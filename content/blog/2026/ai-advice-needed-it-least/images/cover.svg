<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A bar chart with two columns. A short muted bar labelled BASIC PROMPT sits well below a tall orange bar labelled STRUCTURED PROMPT. A bracket between their tops is labelled the question gap, about 100 thousand dollars.">
  <defs><style>
    .serif{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;}
    .sans{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;}
  </style></defs>

  <rect width="1200" height="630" fill="#FAF7F2"/>
  <rect x="14" y="14" width="1172" height="602" rx="10" fill="none" stroke="#E8DDD0" stroke-width="2"/>

  <!-- two-bar "question gap" chart, right side -->
  <g>
    <!-- baseline -->
    <line x1="800" y1="512" x2="1120" y2="512" stroke="#D9CDBD" stroke-width="2"/>

    <!-- basic prompt: short muted bar -->
    <rect x="820" y="408" width="118" height="104" rx="6" fill="#EADFD1" stroke="#E0D3C2" stroke-width="1.5"/>
    <text x="879" y="540" class="sans" font-size="16" font-weight="700" fill="#8A8177" text-anchor="middle">BASIC</text>
    <text x="879" y="560" class="sans" font-size="16" font-weight="700" fill="#8A8177" text-anchor="middle">PROMPT</text>

    <!-- structured prompt: tall orange bar -->
    <rect x="988" y="196" width="118" height="316" rx="6" fill="#BF4B1A"/>
    <text x="1047" y="540" class="sans" font-size="16" font-weight="700" fill="#5C554F" text-anchor="middle">STRUCTURED</text>
    <text x="1047" y="560" class="sans" font-size="16" font-weight="700" fill="#5C554F" text-anchor="middle">PROMPT</text>

    <!-- gap bracket between the two bar tops -->
    <g stroke="#BF4B1A" stroke-width="2.5" fill="none">
      <line x1="948" y1="408" x2="1150" y2="408" stroke-dasharray="5 5"/>
      <line x1="1150" y1="408" x2="1150" y2="196"/>
      <line x1="1130" y1="196" x2="1150" y2="196"/>
      <line x1="1130" y1="408" x2="1150" y2="408"/>
    </g>
    <text x="1163" y="298" class="sans" font-size="17" font-weight="800" fill="#BF4B1A">the</text>
    <text x="1163" y="320" class="sans" font-size="17" font-weight="800" fill="#BF4B1A">question</text>
    <text x="1163" y="342" class="sans" font-size="17" font-weight="800" fill="#BF4B1A">gap</text>
  </g>

  <!-- left text block -->
  <text x="84" y="150" class="sans" font-size="19" letter-spacing="4" fill="#7B746E">AI  ·  PRODUCT STRATEGY</text>

  <text x="84" y="252" class="serif" font-size="54" font-weight="800" fill="#1A1816">Better advice for</text>
  <text x="84" y="314" class="serif" font-size="54" font-weight="800" fill="#1A1816">the people who</text>
  <text x="84" y="376" class="serif" font-size="54" font-weight="800" fill="#BF4B1A">needed it least.</text>

  <rect x="84" y="410" width="72" height="5" rx="2.5" fill="#BF4B1A"/>
  <text x="84" y="462" class="sans" font-size="21" fill="#7B746E">The model was capable. The gap came from</text>
  <text x="84" y="492" class="sans" font-size="21" fill="#7B746E">the question. Whoever owns the question</text>
  <text x="84" y="522" class="sans" font-size="21" fill="#7B746E">owns the outcome.</text>
</svg>
