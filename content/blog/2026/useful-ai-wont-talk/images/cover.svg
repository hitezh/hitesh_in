<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A faded, crossed-out empty chat bubble beside a solid decision card reading fraud equals true with confidence 0.87, over the headline 'It won't talk. It'll decide.'">
  <defs><style>
    .serif{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;}
    .sans{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;}
    .mono{font-family:'SF Mono', ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;}
  </style></defs>

  <rect width="1200" height="630" fill="#FAF7F2"/>
  <rect x="14" y="14" width="1172" height="602" rx="10" fill="none" stroke="#E8DDD0" stroke-width="2"/>

  <!-- the chatbot, faded and set aside -->
  <g opacity="0.9">
    <rect x="828" y="150" width="240" height="120" rx="18" fill="none" stroke="#D6CBBC" stroke-width="2.5" stroke-dasharray="7 7"/>
    <path d="M868 270 l0 34 l34 -34 z" fill="none" stroke="#D6CBBC" stroke-width="2.5" stroke-dasharray="7 7"/>
    <line x1="864" y1="192" x2="1032" y2="192" stroke="#D6CBBC" stroke-width="6" stroke-linecap="round"/>
    <line x1="864" y1="216" x2="1010" y2="216" stroke="#D6CBBC" stroke-width="6" stroke-linecap="round"/>
    <line x1="864" y1="240" x2="972" y2="240" stroke="#D6CBBC" stroke-width="6" stroke-linecap="round"/>
    <!-- struck through -->
    <line x1="808" y1="300" x2="1088" y2="130" stroke="#C9BEB0" stroke-width="4" stroke-linecap="round"/>
    <text x="948" y="330" class="sans" font-size="16" font-weight="700" letter-spacing="2.5" fill="#B7AEA4" text-anchor="middle">NO CONVERSATION</text>
  </g>

  <!-- the decision the software actually uses -->
  <g>
    <rect x="812" y="378" width="272" height="150" rx="14" fill="#FFFDFA" stroke="#BF4B1A" stroke-width="3"/>
    <text x="840" y="426" class="mono" font-size="26" font-weight="700" fill="#1A1816">fraud: <tspan fill="#BF4B1A">true</tspan></text>
    <line x1="840" y1="448" x2="1056" y2="448" stroke="#EadFd0" stroke-width="2"/>
    <text x="840" y="486" class="mono" font-size="20" fill="#7B746E">confidence</text>
    <text x="1056" y="486" class="mono" font-size="24" font-weight="700" fill="#1A1816" text-anchor="end">0.87</text>
    <!-- confidence bar -->
    <rect x="840" y="502" width="216" height="8" rx="4" fill="#EFE6D9"/>
    <rect x="840" y="502" width="188" height="8" rx="4" fill="#BF4B1A"/>
  </g>

  <!-- headline -->
  <text x="84" y="150" class="sans" font-size="19" letter-spacing="4" fill="#7B746E">AI  STRATEGY</text>

  <text x="84" y="266" class="serif" font-size="62" font-weight="800" fill="#1A1816">It won't talk.</text>
  <text x="84" y="338" class="serif" font-size="62" font-weight="800" fill="#BF4B1A">It'll decide.</text>

  <rect x="84" y="374" width="72" height="5" rx="2.5" fill="#BF4B1A"/>

  <text x="84" y="428" class="sans" font-size="21" fill="#7B746E">The value moved from conversation to a</text>
  <text x="84" y="458" class="sans" font-size="21" fill="#7B746E">calibrated call, and knowing when to trust it.</text>
</svg>
