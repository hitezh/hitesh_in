<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="An editorial diagram: a block of code where one clever, indented line is highlighted and carries a hanging price tag, while the plain lines around it stay untagged. AI just put a price on clever code.">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
      .sans  { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="1200" height="630" fill="#FAF7F2"/>
  <rect x="14" y="14" width="1172" height="602" rx="10" fill="none" stroke="#E8DDD0" stroke-width="2"/>

  <!-- left: text block -->
  <text x="92" y="150" class="sans" font-size="19" letter-spacing="4" fill="#7B746E">ON&#160;&#160;AI&#160;&#160;STRATEGY</text>

  <text x="88" y="266" class="serif" font-size="74" fill="#1A1816">AI put a price</text>
  <text x="88" y="346" class="serif" font-size="74" fill="#1A1816">on clever code<tspan fill="#BF4B1A">.</tspan></text>

  <rect x="92" y="380" width="68" height="5" rx="2.5" fill="#BF4B1A"/>

  <text x="92" y="436" class="sans" font-size="22" fill="#7B746E">A model reads and rewrites your code now.</text>
  <text x="92" y="468" class="sans" font-size="22" fill="#7B746E">Legibility stopped being a matter of taste.</text>

  <!-- right: code block -->
  <rect x="742" y="150" width="378" height="330" rx="10" fill="#FFFFFF" stroke="#E8DDD0" stroke-width="2"/>
  <!-- window dots -->
  <circle cx="768" cy="178" r="6" fill="#E8DDD0"/>
  <circle cx="788" cy="178" r="6" fill="#E8DDD0"/>
  <circle cx="808" cy="178" r="6" fill="#E8DDD0"/>
  <line x1="742" y1="200" x2="1120" y2="200" stroke="#E8DDD0" stroke-width="2"/>

  <!-- plain, untagged lines -->
  <g>
    <rect x="770" y="224" width="150" height="12" rx="6" fill="#1A1816"/>
    <rect x="930" y="224" width="86" height="12" rx="6" fill="#7B746E"/>

    <rect x="798" y="256" width="120" height="12" rx="6" fill="#7B746E"/>
    <rect x="926" y="256" width="70" height="12" rx="6" fill="#7B746E"/>
  </g>

  <!-- the clever line: highlighted and tagged -->
  <rect x="754" y="292" width="354" height="30" rx="6" fill="#BF4B1A" fill-opacity="0.10"/>
  <rect x="826" y="301" width="150" height="12" rx="6" fill="#BF4B1A"/>
  <rect x="984" y="301" width="60" height="12" rx="6" fill="#BF4B1A" fill-opacity="0.55"/>

  <!-- hanging price tag on the clever line -->
  <g>
    <line x1="1044" y1="307" x2="1082" y2="307" stroke="#BF4B1A" stroke-width="2"/>
    <path d="M1082,289 L1130,289 A8,8 0 0 1 1138,297 L1138,317 A8,8 0 0 1 1130,325 L1082,325 L1066,307 Z" fill="#BF4B1A"/>
    <circle cx="1090" cy="307" r="4" fill="#FAF7F2"/>
  </g>

  <!-- more plain lines below -->
  <g>
    <rect x="826" y="346" width="96" height="12" rx="6" fill="#7B746E"/>
    <rect x="930" y="346" width="110" height="12" rx="6" fill="#7B746E"/>

    <rect x="770" y="378" width="110" height="12" rx="6" fill="#7B746E"/>
    <rect x="890" y="378" width="60" height="12" rx="6" fill="#1A1816"/>
  </g>

  <!-- caption -->
  <text x="754" y="466" class="sans" font-size="17" fill="#B5AFA9">one clever line, and the bill moved onto it</text>
</svg>
