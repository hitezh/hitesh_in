<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A verification checkmark badge with an identical forged copy offset behind it, showing that the authenticity signal can be duplicated.">
  <defs><style>
    .serif{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;}
    .sans{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;}
  </style></defs>

  <rect width="1200" height="630" fill="#FAF7F2"/>
  <rect x="14" y="14" width="1172" height="602" rx="10" fill="none" stroke="#E8DDD0" stroke-width="2"/>

  <!-- forged copy: dashed, offset behind -->
  <g transform="translate(1000 300)">
    <circle cx="26" cy="26" r="118" fill="none" stroke="#C9BEB0" stroke-width="3" stroke-dasharray="8 8"/>
    <path d="M-24 30 L6 60 L74 -18" fill="none" stroke="#C9BEB0" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8" transform="translate(26 26)"/>
  </g>

  <!-- the "real" badge, solid, accent -->
  <g transform="translate(960 296)">
    <circle cx="0" cy="0" r="118" fill="#BF4B1A"/>
    <circle cx="0" cy="0" r="118" fill="none" stroke="#A63F14" stroke-width="3"/>
    <path d="M-50 6 L-12 44 L58 -40" fill="none" stroke="#FAF7F2" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="754" y="470" class="sans" font-size="20" letter-spacing="3" fill="#A79E95" text-anchor="middle">VERIFIED  ·  VERIFIED?</text>

  <!-- title -->
  <text x="84" y="150" class="sans" font-size="19" letter-spacing="4" fill="#7B746E">CONTENT  PROVENANCE</text>

  <text x="84" y="262" class="serif" font-size="56" font-weight="800" fill="#1A1816">The authenticity</text>
  <text x="84" y="326" class="serif" font-size="56" font-weight="800" fill="#1A1816">checkmark you</text>
  <text x="84" y="390" class="serif" font-size="56" font-weight="800" fill="#BF4B1A">can forge.</text>

  <rect x="84" y="424" width="72" height="5" rx="2.5" fill="#BF4B1A"/>
  <text x="84" y="474" class="sans" font-size="21" fill="#7B746E">A signature that can be faked doesn't fail</text>
  <text x="84" y="504" class="sans" font-size="21" fill="#7B746E">neutrally. It vouches for the forger.</text>
</svg>
