<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Cover reading Code got cheap, your abstractions got expensive, over a chart where a falling line crosses a rising line">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9FF43"/>
      <stop offset="1" stop-color="#50E3C2"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
    <style>
      .display { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#surface)"/>
  <circle cx="1080" cy="-10" r="220" fill="#2166F3" fill-opacity=".52" filter="url(#blur)"/>
  <circle cx="1020" cy="580" r="180" fill="#00C2A8" fill-opacity=".24" filter="url(#blur)"/>
  <path d="M0 535 C240 420 365 670 595 532 S950 426 1200 520" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="574" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/>

  <g class="sans" fill="#D9FF43">
    <circle cx="88" cy="96" r="7"/>
    <text x="108" y="103" font-size="17" font-weight="700" letter-spacing="3">TECHNOLOGY STRATEGY</text>
  </g>

  <g class="display" font-size="76" font-weight="700" fill="#FFFFFF">
    <text x="82" y="224">Code got cheap.</text>
    <text x="82" y="310">Your abstractions</text>
    <text x="82" y="396">got <tspan fill="#D9FF43">expensive.</tspan></text>
  </g>

  <text x="88" y="462" class="sans" font-size="23" fill="#D9E2F2">Shopify went back to native. The real story is about your whole stack.</text>

  <!-- Supporting visual: a falling "cost of code" line crossing a rising "abstraction tax" line. -->
  <g transform="translate(905 286)">
    <circle r="118" fill="#D9FF43" fill-opacity=".10" stroke="#D9FF43" stroke-width="2"/>
    <line x1="-84" y1="70" x2="84" y2="70" stroke="#FFFFFF" stroke-opacity=".30" stroke-width="2"/>
    <line x1="-84" y1="70" x2="-84" y2="-78" stroke="#FFFFFF" stroke-opacity=".30" stroke-width="2"/>
    <path d="M-78 -60 L78 58" fill="none" stroke="#8FA3C6" stroke-width="8" stroke-linecap="round"/>
    <path d="M-78 58 L78 -60" fill="none" stroke="url(#signal)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="78" cy="-60" r="10" fill="#D9FF43"/>
  </g>

  <text x="88" y="556" class="sans" font-size="16" font-weight="700" letter-spacing="2.5" fill="#AAB8D0">HITESH.IN</text>
</svg>
