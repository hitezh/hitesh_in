<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Blog cover reading 'The default is the new moat', with several small tool nodes converging into one highlighted node, on a dark background.">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9FF43"/>
      <stop offset="1" stop-color="#50E3C2"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
    <style>
      .display { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#surface)"/>
  <circle cx="1080" cy="-10" r="220" fill="#2166F3" fill-opacity=".52" filter="url(#blur)"/>
  <circle cx="1020" cy="580" r="180" fill="#00C2A8" fill-opacity=".24" filter="url(#blur)"/>
  <path d="M0 535 C240 420 365 670 595 532 S950 426 1200 520" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="574" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/>

  <g class="sans" fill="#D9FF43">
    <circle cx="88" cy="96" r="7"/>
    <text x="108" y="103" font-size="17" font-weight="700" letter-spacing="3">AI STRATEGY</text>
  </g>

  <g class="display" font-size="82" font-weight="700" fill="#FFFFFF">
    <text x="82" y="232">The default</text>
    <text x="82" y="322">is the new</text>
    <text x="82" y="412"><tspan fill="#D9FF43">moat.</tspan></text>
  </g>

  <text x="88" y="474" class="sans" font-size="23" fill="#D9E2F2">Shopify paid for a free framework AI already emits by default.</text>

  <!-- Many tools converge into one highlighted default node. -->
  <g transform="translate(955 292)">
    <circle r="118" fill="#D9FF43" fill-opacity=".10" stroke="#D9FF43" stroke-width="2"/>
    <g stroke="url(#signal)" stroke-width="4" stroke-linecap="round" fill="none" opacity=".85">
      <path d="M-96 -70 L0 0"/>
      <path d="M-104 8 L0 0"/>
      <path d="M-84 82 L0 0"/>
      <path d="M8 -104 L0 0"/>
      <path d="M92 -66 L0 0"/>
      <path d="M100 26 L0 0"/>
    </g>
    <g fill="#8FA3C4">
      <circle cx="-96" cy="-70" r="11"/>
      <circle cx="-104" cy="8" r="11"/>
      <circle cx="-84" cy="82" r="11"/>
      <circle cx="8" cy="-104" r="11"/>
      <circle cx="92" cy="-66" r="11"/>
      <circle cx="100" cy="26" r="11"/>
    </g>
    <circle r="26" fill="#D9FF43"/>
    <circle r="26" fill="none" stroke="#FFFFFF" stroke-opacity=".65" stroke-width="2"/>
  </g>

  <text x="88" y="556" class="sans" font-size="16" font-weight="700" letter-spacing="2.5" fill="#AAB8D0">HITESH.IN</text>
</svg>
