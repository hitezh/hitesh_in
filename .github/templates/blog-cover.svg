<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Template for a blog cover styled as a screenshotted X post: an avatar and handle, an oversized claim as the post text, an attached visual, and an engagement bar.">
  <defs>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2166F3"/>
      <stop offset="1" stop-color="#00C2A8"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Base: near-black, like an X/Twitter dark-mode embed, with a rounded card frame. -->
  <rect width="1200" height="630" fill="#000000"/>
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="#000000" stroke="#2F3336" stroke-width="2"/>

  <!-- Platform mark, top right. A generic crossed mark, not a traced logo. -->
  <g transform="translate(1114 50)" stroke="#E7E9EA" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="0" x2="22" y2="22"/>
    <line x1="22" y1="0" x2="0" y2="22"/>
  </g>

  <!-- Author header: avatar, display name, verified check, handle. -->
  <g>
    <circle cx="108" cy="108" r="44" fill="url(#avatar)"/>
    <text x="108" y="120" class="sans" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle">HS</text>

    <text x="172" y="98" class="sans" font-size="30" font-weight="800" fill="#E7E9EA">Hitesh Sarda</text>
    <g transform="translate(432 84)">
      <circle r="13" fill="#1D9BF0"/>
      <path d="M-6 0l4 4 8-8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Replace the date with the post's real publish date. -->
    <text x="172" y="134" class="sans" font-size="24" fill="#71767B">@fullstackcto &#183; Sep 16</text>
  </g>

  <!-- Post text: keep the claim to 2-4 lines. Make one key word signal-colored. -->
  <g class="sans" font-size="58" font-weight="700" fill="#E7E9EA">
    <text x="72" y="232">The sharp claim</text>
    <text x="72" y="304">goes <tspan fill="#D9FF43">right here.</tspan></text>
    <text x="72" y="376">Make it worth stopping.</text>
  </g>

  <!-- Use this line only for a concrete fact or a useful tension. -->
  <text x="72" y="428" class="sans" font-size="26" fill="#D9E2F2">A short, specific line that earns the click.</text>

  <!-- Replace with a hashtag version of the category, e.g. #AISTRATEGY or #BANKING. -->
  <text x="72" y="466" class="sans" font-size="26" font-weight="700" fill="#1D9BF0">#CATEGORY</text>

  <!-- Attached media: replace with one simple diagram, object, or number, styled like an embedded image. -->
  <g transform="translate(860 210)">
    <rect x="0" y="0" width="256" height="220" rx="18" fill="#16181C" stroke="#2F3336" stroke-width="2"/>
    <g transform="translate(128 110)">
      <circle r="80" fill="#D9FF43" fill-opacity=".12" stroke="#D9FF43" stroke-width="2"/>
      <circle r="54" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2" stroke-dasharray="6 9"/>
      <path d="M-30 12 L-3 -18 L18 3 L42 -34" fill="none" stroke="#50E3C2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="42" cy="-34" r="7" fill="#D9FF43"/>
    </g>
  </g>

  <!-- Analytics row, above the divider. Adjust the view count to taste. -->
  <text x="72" y="510" class="sans" font-size="22" fill="#71767B">10:41 AM &#183; Sep 16, 2026 &#183; <tspan font-weight="700" fill="#E7E9EA">412K</tspan> Views</text>
  <line x1="64" y1="530" x2="1136" y2="530" stroke="#2F3336" stroke-width="1"/>

  <!-- Engagement bar: reply, repost, like, bookmark, share. Counts are cosmetic; keep them plausible, not absurd. -->
  <g class="sans" font-size="22" fill="#71767B">
    <g transform="translate(72 556)">
      <path d="M2 3h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2z" fill="none" stroke="#71767B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="16">482</text>
    </g>
    <g transform="translate(292 556)">
      <path d="M17 1l4 4-4 4 M3 11V9a4 4 0 0 1 4-4h14 M7 23l-4-4 4-4 M21 13v2a4 4 0 0 1-4 4H3" fill="none" stroke="#00BA7C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="16" fill="#00BA7C" font-weight="700">3.1K</text>
    </g>
    <g transform="translate(512 556)">
      <path d="M12 21.5l-1.6-1.4C4.9 15.4 1.5 12.4 1.5 8.6 1.5 5.5 3.9 3 7 3c1.7 0 3.4.8 4.5 2.1C12.6 3.8 14.3 3 16 3c3.1 0 5.5 2.5 5.5 5.6 0 3.8-3.4 6.8-8.9 11.5L12 21.5z" fill="#F91880"/>
      <text x="32" y="16" fill="#F91880" font-weight="700">18.4K</text>
    </g>
    <g transform="translate(940 556)">
      <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" fill="none" stroke="#71767B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(1080 556)">
      <path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7 M16 6l-4-4-4 4 M12 2v14" fill="none" stroke="#71767B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
