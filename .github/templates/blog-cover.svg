<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Template for a blog cover styled as a screenshot of an X post: an avatar, name and handle, a claim in caps followed by a concrete supporting line, and a view count.">
  <defs>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2166F3"/>
      <stop offset="1" stop-color="#00C2A8"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Full-bleed black, like an X dark-mode screenshot. No frame, no border. -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Author row: avatar, name with a verified check, handle underneath, Follow pill, menu. -->
  <circle cx="104" cy="96" r="44" fill="url(#avatar)"/>
  <text x="104" y="108" class="sans" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle">HS</text>

  <text x="168" y="86" class="sans" font-size="35" font-weight="700" fill="#E7E9EA">Hitesh Sarda</text>
  <g transform="translate(406 74)">
    <circle r="15" fill="#1D9BF0"/>
    <path d="M-7 0l5 5 9-9" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="168" y="132" class="sans" font-size="33" fill="#71767B">@fullstackcto</text>

  <rect x="856" y="64" width="190" height="64" rx="32" fill="#EFF3F4"/>
  <text x="951" y="107" class="sans" font-size="30" font-weight="700" fill="#0F1419" text-anchor="middle">Follow</text>
  <g fill="#71767B">
    <circle cx="1092" cy="96" r="5"/>
    <circle cx="1114" cy="96" r="5"/>
    <circle cx="1136" cy="96" r="5"/>
  </g>

  <!-- The post itself. Regular weight, full width, no accent colour: it has to read as
       text someone typed, not as a designed headline.

       Open with the claim in caps (2 lines, the hook), leave a blank line, then land a
       concrete supporting line (2 lines). Keep it to these four lines so it stays
       legible at feed thumbnail size. -->
  <g class="sans" font-size="52" fill="#E7E9EA">
    <text x="64" y="244">PUT THE SHARP CLAIM HERE, IN</text>
    <text x="64" y="310">CAPS, ACROSS TWO FULL LINES.</text>

    <text x="64" y="406">then one concrete, specific line that</text>
    <text x="64" y="472">makes the claim worth stopping for.</text>
  </g>

  <!-- Timestamp and view count. Use the post's real publish date; keep the count plausible. -->
  <text x="64" y="566" class="sans" font-size="30" fill="#71767B">8:31 PM &#183; Sep 16, 2026 &#183; <tspan font-weight="700" fill="#E7E9EA">1.8M</tspan> Views</text>
</svg>
