name: Post rhythm and titles

# Advisory check on pull requests that publish a post: warns when posts are
# bunched together or a title uses the negate-then-reframe formula. It never
# fails the build. Rules live in AGENTS.md, "Rhythm and titles".

on:
  pull_request:
    paths:
      - "content/blog/**/index.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check post rhythm and titles
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/check-post-rhythm.mjs
