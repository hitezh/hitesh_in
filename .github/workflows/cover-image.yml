name: Generate cover & slide PNGs

# Social platforms can't render SVG, so every blog cover.svg (and, for a
# LinkedIn carousel, each slide-N.svg) needs a raster PNG sibling (used by the
# Open Graph card in head.html and by the LinkedIn announcer). Authors commit
# only the SVG; this workflow renders the PNG from it with headless Chromium
# and commits the result back to the branch, so a missing raster can never
# reach master again.
#
# It runs on branch pushes (before a post is merged), so the PNG lands on the
# feature branch and is already present when the post reaches master.

on:
  push:
    paths:
      - "content/blog/**/images/cover.svg"
      - "content/blog/**/images/slide-*.svg"
      - ".github/scripts/rasterize-cover.mjs"
      - ".github/workflows/cover-image.yml"
  workflow_dispatch:
    inputs:
      all:
        description: "Re-render every cover, not just missing/stale ones"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  covers:
    # Don't run on forks: they lack the secrets and shouldn't push commits.
    if: github.repository == 'hitezh/hitesh_in'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can diff the push range for changed covers

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium (Playwright)
        # Install the Playwright module itself (not just the browser): the
        # rasterize script imports `playwright` and resolves it from the global
        # npm root, so `npx ... install` alone (browser only) leaves it missing.
        run: |
          npm i -g playwright@1.55.0
          playwright install --with-deps chromium

      - name: Render cover PNGs
        env:
          EVENT: ${{ github.event_name }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Manual run: --all when asked, otherwise fill in any missing PNGs.
            [ "$FORCE_ALL" = "true" ] && node .github/scripts/rasterize-cover.mjs --all || node .github/scripts/rasterize-cover.mjs
            exit 0
          fi
          # Push: re-render exactly the cover.svg/slide-N.svg files changed in
          # this range, plus (via the no-arg pass below) any still missing a PNG.
          RANGE="${BEFORE}..${AFTER}"
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${AFTER}"
            CHANGED=$(git show --name-only --diff-filter=AM --format= "$AFTER" -- 'content/blog/**/images/cover.svg' 'content/blog/**/images/slide-*.svg' | grep -E '(cover|slide-[0-9]+)\.svg$' || true)
          else
            CHANGED=$(git diff --name-only --diff-filter=AM "$RANGE" -- 'content/blog/**/images/cover.svg' 'content/blog/**/images/slide-*.svg' | grep -E '(cover|slide-[0-9]+)\.svg$' || true)
          fi
          if [ -n "$CHANGED" ]; then
            echo "Changed covers/slides:"; echo "$CHANGED"
            # shellcheck disable=SC2086
            node .github/scripts/rasterize-cover.mjs $CHANGED
          fi
          node .github/scripts/rasterize-cover.mjs

      - name: Commit any generated PNGs
        run: |
          set -euo pipefail
          # Quote the git pathspecs and use :(glob) so git (not the shell) expands
          # them: ** must cross the <year>/<slug> directories to match.
          PATHSPEC1=':(glob)content/blog/**/images/cover.png'
          PATHSPEC2=':(glob)content/blog/**/images/slide-*.png'
          if [ -z "$(git status --porcelain -- "$PATHSPEC1" "$PATHSPEC2")" ]; then
            echo "No cover/slide PNGs changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PATHSPEC1" "$PATHSPEC2"
          git commit -m "Generate cover/slide PNG(s) from SVG"
          git push origin "HEAD:${GITHUB_REF_NAME}"
