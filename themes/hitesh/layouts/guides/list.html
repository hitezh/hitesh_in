{{ define "main" }}
<div class="list-page">
  <div class="container">
    <header class="page-header">
      <h1 class="page-title">{{ .Title }}</h1>
      {{ with .Params.description }}
      <p class="page-description">{{ . }}</p>
      {{ end }}
    </header>

    {{ with .Content }}<div class="post-body">{{ . }}</div>{{ end }}

    <ol class="guide-list">
      {{ range $i, $g := .Pages.ByWeight }}
      <li><a href="{{ $g.RelPermalink }}"><span class="guide-n">{{ printf "%02d" (add $i 1) }}</span><span class="guide-t">{{ $g.Title }}</span>{{ with $g.Params.description }}<span class="guide-d">{{ . }}</span>{{ end }}<span class="guide-go">&rarr;</span></a></li>
      {{ end }}
    </ol>
  </div>
</div>
{{ end }}
