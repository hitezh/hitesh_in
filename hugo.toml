  [[menu.main]]
    name   = "Book"
    url    = "/book/"
    weight = 2
  [[menu.main]]
    name   = "AI Training"
    url    = "/ai-training/"
    weight = 3
  [[menu.main]]
    name   = "About"
    url    = "/about/"
    weight = 4
  [[menu.main]]
